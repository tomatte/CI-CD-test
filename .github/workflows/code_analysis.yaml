name: PHP CodeSniffer

on:
  pull_request:
    paths:
      - '**.php'

permissions:
  pull-requests: write
  contents: write

jobs:
  phpcs:
    name: PHP CodeSniffer
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
          
      - name: Install PHP_CodeSniffer
        run: |
          composer require --dev squizlabs/php_codesniffer
          
      - name: Run PHP_CodeSniffer
        id: phpcs
        run: |
          vendor/bin/phpcs --standard=PSR12 --extensions=php --ignore=*/vendor/* --report=full . > phpcs_output.txt || echo "PHPCS_FOUND_ISSUES=true" >> $GITHUB_ENV
          cat phpcs_output.txt
          
      - name: Check for auto-fixable issues
        if: env.PHPCS_FOUND_ISSUES == 'true'
        run: |
          echo "Found PSR-12 issues. Creating summary..."
          echo "## :warning: PHP CodeSniffer Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This pull request has PSR-12 coding standard violations:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat phpcs_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        if: env.PHPCS_FOUND_ISSUES == 'true'
        with:
          header: phpcs
          message: |
            ## PHP CodeSniffer Results
            
            This pull request has PSR-12 coding standard violations that should be fixed.
            
            <details>
            <summary>View details</summary>
            
            ```
            $(cat phpcs_output.txt)
            ```
            </details>
            
            ### How to fix these issues
            
            You can run this command locally to automatically fix the issues:
            
            ```bash
            vendor/bin/phpcbf --standard=PSR12 --extensions=php --ignore=*/vendor/* .
            ```
            
            Or click the button below to have the workflow fix the issues automatically:
            
            [Fix PSR-12 Issues](https://github.com/${{ github.repository }}/actions/workflows/fix-psr12.yml/dispatch)
            
      - name: Create "Fix PSR-12 Issues" workflow if not exists
        if: env.PHPCS_FOUND_ISSUES == 'true'
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/fix-psr12.yml << 'EOL'
          name: Fix PSR-12 Issues
          
          on:
            workflow_dispatch:
              inputs:
                pr_number:
                  description: 'PR number to fix'
                  required: true
                  default: '${{ github.event.pull_request.number }}'
          
          permissions:
            contents: write
            pull-requests: write
          
          jobs:
            fix:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout code
                  uses: actions/checkout@v3
                  with:
                    ref: ${{ github.event.pull_request.head.ref }}
                    repository: ${{ github.event.pull_request.head.repo.full_name }}
                
                - name: Setup PHP
                  uses: shivammathur/setup-php@v2
                  with:
                    php-version: '8.1'
                    tools: composer:v2
                    coverage: none
                
                - name: Install PHP_CodeSniffer
                  run: |
                    composer require --dev squizlabs/php_codesniffer
                
                - name: Fix PSR-12 issues
                  run: |
                    vendor/bin/phpcbf --standard=PSR12 --extensions=php --ignore=*/vendor/* .
                
                - name: Commit changes
                  run: |
                    git config --local user.email "action@github.com"
                    git config --local user.name "GitHub Action"
                    git add .
                    git diff --cached --quiet || git commit -m "Fix PSR-12 coding standards"
                    git push
                
                - name: Comment on PR
                  uses: marocchino/sticky-pull-request-comment@v2
                  with:
                    header: phpcs-fixed
                    message: |
                      ## ✅ PSR-12 issues fixed!
                      
                      The coding standard issues have been automatically fixed and committed to this pull request.
          EOL
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .github/workflows/fix-psr12.yml
          git diff --cached --quiet || git commit -m "Add workflow to fix PSR-12 issues"
          git push || echo "Could not push fix-psr12 workflow. It might already exist or you don't have permission to push directly to this branch."
          
      - name: Comment on PR if no issues
        uses: marocchino/sticky-pull-request-comment@v2
        if: env.PHPCS_FOUND_ISSUES != 'true'
        with:
          header: phpcs
          message: |
            ## ✅ PHP CodeSniffer Results
            
            Great job! No PSR-12 issues found in this pull request.